# 测试/UAT 演练环境。
#
# 与正式环境使用同一套镜像与配置逻辑（migrate + app + postgres），
# 但使用独立 project（mentor-ai-test）、独立数据卷和端口：
# - postgres: 127.0.0.1:5435，库名 mentor_ai，数据卷 mentor-ai-test_postgres-data
# - app: 127.0.0.1:3400 -> 3300
# - Ollama 不随测试环境启动；EMBEDDING_ENABLED=false 走关键词模式
#
# 数据来源：测试环境使用自有数据并跨版本保留。发布测试版本时只重建镜像、
# 执行 migration 并重启，不得用正式库备份覆盖测试库，也不执行
# scripts/refresh-test-db.sh（该脚本仅限明确的特殊场景经授权手动使用，
# 见 docs/DEVELOPMENT_AND_PRODUCTION.md 第 8.4 节）。
#
# 注意：测试库中可能残留早期从正式库恢复的数据副本（真实人员与业务内容），
# 默认仅允许本机回环访问；经授权开放局域网（0.0.0.0）时仅限校内网络，
# 仍禁止将数据外传或截图外发。
name: mentor-ai-test

x-app-environment: &app-environment
  TZ: Asia/Shanghai
  DATABASE_URL: postgres://${APP_DB_USER:-mentor_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/mentor_ai
  NUXT_DATABASE_URL: postgres://${APP_DB_USER:-mentor_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/mentor_ai
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  NUXT_SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
  NUXT_ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  NUXT_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  NUXT_DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_ROUTER_MODEL: ${DEEPSEEK_ROUTER_MODEL:-deepseek-flash}
  NUXT_DEEPSEEK_ROUTER_MODEL: ${DEEPSEEK_ROUTER_MODEL:-deepseek-flash}
  DEEPSEEK_GENERATOR_MODEL: ${DEEPSEEK_GENERATOR_MODEL:-deepseek-flash}
  NUXT_DEEPSEEK_GENERATOR_MODEL: ${DEEPSEEK_GENERATOR_MODEL:-deepseek-flash}
  DEEPSEEK_AGREEMENT_VERSION: ${DEEPSEEK_AGREEMENT_VERSION:-}
  NUXT_DEEPSEEK_AGREEMENT_VERSION: ${DEEPSEEK_AGREEMENT_VERSION:-}
  NUXT_DEEPSEEK_TIMEOUT_MS: ${DEEPSEEK_TIMEOUT_MS:-30000}
  # Agent 对话记忆（只追加前缀 + token 预算）
  NUXT_AGENT_HISTORY_TOKEN_BUDGET: ${AI_AGENT_HISTORY_TOKEN_BUDGET:-24000}
  NUXT_AGENT_MAX_OUTPUT_TOKENS: ${AI_AGENT_MAX_OUTPUT_TOKENS:-4096}
  NUXT_AGENT_COMPACTION_KEEP_RATIO: ${AI_AGENT_COMPACTION_KEEP_RATIO:-0.5}
  # Agent 工具治理与 strict JSON 试点（strict 为 DeepSeek Beta，不可用时自动回退 json_object）
  NUXT_AGENT_MAX_TOOL_ROUNDS: ${AI_AGENT_MAX_TOOL_ROUNDS:-8}
  NUXT_AGENT_ENABLED_TOOLS: ${AI_AGENT_ENABLED_TOOLS:-}
  NUXT_AI_STRICT_JSON_PURPOSES: ${AI_STRICT_JSON_PURPOSES:-}
  EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-false}
  NUXT_EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-false}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
  NUXT_EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
  DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  NUXT_DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  NUXT_DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  # 语音输入与回答朗读（百炼）：总开关、模型与音色；学校数据模式为 local 时服务端整体禁用
  DASHSCOPE_API_BASE_URL: ${DASHSCOPE_API_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
  NUXT_DASHSCOPE_API_BASE_URL: ${DASHSCOPE_API_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
  SPEECH_ENABLED: ${SPEECH_ENABLED:-true}
  NUXT_SPEECH_ENABLED: ${SPEECH_ENABLED:-true}
  ASR_MODEL: ${ASR_MODEL:-qwen-audio-3.0-asr-flash}
  NUXT_ASR_MODEL: ${ASR_MODEL:-qwen-audio-3.0-asr-flash}
  TTS_MODEL: ${TTS_MODEL:-qwen-audio-3.0-tts-flash}
  NUXT_TTS_MODEL: ${TTS_MODEL:-qwen-audio-3.0-tts-flash}
  TTS_VOICE: ${TTS_VOICE:-longanlingxi}
  NUXT_TTS_VOICE: ${TTS_VOICE:-longanlingxi}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
  NUXT_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
  EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-8000}
  NUXT_EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-8000}
  SMS_PROVIDER: ${SMS_PROVIDER:-mock}
  NUXT_SMS_PROVIDER: ${SMS_PROVIDER:-mock}
  SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
  NUXT_SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
  SMS_WEBHOOK_TOKEN: ${SMS_WEBHOOK_TOKEN:-}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  NUXT_OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  NUXT_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  NUXT_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
  NUXT_OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
  NUXT_PUBLIC_SHOW_SSO_LOGIN: ${OIDC_ISSUER:+true}

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    restart: unless-stopped
    # 与 docker-compose.yml 一致：显式指定服务器时区（TZ 环境变量对 postgres 无效）
    command: ["postgres", "-c", "timezone=Asia/Shanghai"]
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: ${POSTGRES_USER:-mentor_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: mentor_ai
      APP_DB_USER: ${APP_DB_USER:-mentor_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mentor_admin} -d mentor_ai"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  migrate:
    build: .
    environment:
      <<: *app-environment
      DATABASE_URL: postgres://${POSTGRES_USER:-mentor_admin}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/mentor_ai
    command: ["./node_modules/.bin/tsx", "scripts/migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    # 明文端口不再对外发布：3400 由 nginx 接管并 307 跳到 https://<同一主机>:3401，
    # 应用只在 compose 网络内以 3300 暴露给 nginx（容器健康检查仍走容器内 127.0.0.1:3300）
    expose:
      - "3300"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3300/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  # 测试环境的唯一入口：
  # - 3400 明文：307 跳到 https://<同一主机>:3401（但 /health/* 直通，供发布脚本与监控明文探活）
  # - 3401 HTTPS：TLS 终结后转发 app:3300
  # 应用容器不再直接发布端口（见 app 服务的 expose），避免绕过跳转的明文入口。
  # 证书用 infra/certs-test/（与正式的 infra/certs/ 分开）。
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    environment:
      # 证书里的 SAN 才是浏览器校验的依据；server_name 只影响同名多站点的分流，这里单站点，仅作记录
      SERVER_NAME: ${SERVER_NAME:-localhost}
    ports:
      - "0.0.0.0:3400:3400"
      - "0.0.0.0:3401:3401"
    volumes:
      - ./infra/nginx/test.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/certs-test:/etc/nginx/certs-test:ro
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data: