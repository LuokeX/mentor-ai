name: mentor-ai

x-app-environment: &app-environment
  TZ: Asia/Shanghai
  DATABASE_URL: postgres://${APP_DB_USER:-mentor_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-mentor_ai}
  NUXT_DATABASE_URL: postgres://${APP_DB_USER:-mentor_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-mentor_ai}
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  NUXT_SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
  NUXT_ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  NUXT_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  NUXT_DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_ROUTER_MODEL: ${DEEPSEEK_ROUTER_MODEL:-deepseek-v4-flash}
  NUXT_DEEPSEEK_ROUTER_MODEL: ${DEEPSEEK_ROUTER_MODEL:-deepseek-v4-flash}
  DEEPSEEK_GENERATOR_MODEL: ${DEEPSEEK_GENERATOR_MODEL:-deepseek-v4-flash}
  NUXT_DEEPSEEK_GENERATOR_MODEL: ${DEEPSEEK_GENERATOR_MODEL:-deepseek-v4-flash}
  DEEPSEEK_AGREEMENT_VERSION: ${DEEPSEEK_AGREEMENT_VERSION:-}
  NUXT_DEEPSEEK_AGREEMENT_VERSION: ${DEEPSEEK_AGREEMENT_VERSION:-}
  NUXT_DEEPSEEK_TIMEOUT_MS: ${DEEPSEEK_TIMEOUT_MS:-30000}
  EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-true}
  NUXT_EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-true}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
  NUXT_EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
  OLLAMA_BASE_URL: http://ollama:11434
  NUXT_OLLAMA_BASE_URL: http://ollama:11434
  DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  NUXT_DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  NUXT_DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
  NUXT_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
  EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-8000}
  NUXT_EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-8000}
  SMS_PROVIDER: ${SMS_PROVIDER:-mock}
  NUXT_SMS_PROVIDER: ${SMS_PROVIDER:-mock}
  SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
  NUXT_SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
  SMS_WEBHOOK_TOKEN: ${SMS_WEBHOOK_TOKEN:-}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  NUXT_OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  NUXT_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  NUXT_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
  NUXT_OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
  # OIDC_ISSUER 非空时启用登录页统一身份入口（运行时覆盖，镜像构建时无法判断）
  NUXT_PUBLIC_SHOW_SSO_LOGIN: ${OIDC_ISSUER:+true}

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    restart: unless-stopped
    # TZ 环境变量对 postgres 服务器进程不生效（实测 SHOW timezone 仍为 Etc/UTC），
    # 需用 -c timezone 显式指定服务器默认时区；影响 CURRENT_DATE/CURRENT_TIMESTAMP
    # 与 psql 直查显示，TIMESTAMPTZ 存储语义不变。
    command: ["postgres", "-c", "timezone=Asia/Shanghai"]
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: ${POSTGRES_USER:-mentor_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mentor_ai}
      APP_DB_USER: ${APP_DB_USER:-mentor_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      # PostgreSQL 18 stores data below a major-version directory so upgrades
      # can use pg_upgrade without crossing a mount boundary.
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mentor_admin} -d ${POSTGRES_DB:-mentor_ai}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:0.31.2
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "0.0.0.0:${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  ollama-pull:
    image: ollama/ollama:0.31.2
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${EMBEDDING_MODEL:-qwen3-embedding:0.6b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  migrate:
    build: .
    environment:
      <<: *app-environment
      DATABASE_URL: postgres://${POSTGRES_USER:-mentor_admin}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mentor_ai}
    command: ["./node_modules/.bin/tsx", "scripts/migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3300"
    ports:
      - "0.0.0.0:${APP_PORT:-3300}:3300"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3300/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  embedding-index:
    build: .
    environment: *app-environment
    command: ["./node_modules/.bin/tsx", "scripts/reindex-module-resource-embeddings.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
    restart: "no"

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    profiles: ["tls"]
    environment:
      SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  ollama-data:
